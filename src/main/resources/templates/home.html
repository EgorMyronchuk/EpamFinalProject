<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.home}">Home</title>
    <style>
        body {
            margin: 0;
            padding-top: 100px; /* Отступ сверху, чтобы фиксированные бары не закрывали контент */
            background-color: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .section-header h2 {
            font-size: 24px;
            color: #333;
            margin: 0;
        }

        .more-btn {
            text-decoration: none;
            color: #0052D4;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            border: 2px solid #0052D4;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .more-btn:hover {
            background: #0052D4;
            color: white;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .book-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .book-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .book-info h3 {
            font-size: 16px;
            margin: 10px 0 5px;
            color: #222;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .book-info p {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .book-price {
            font-size: 18px;
            font-weight: 800;
            color: #1a2a6c;
        }

        @media (max-width: 850px) {
            body { padding-top: 160px; } /* Увеличиваем отступ для мобилок, так как поиск съезжает ниже */
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/notifications :: toast}"></div>
<div th:replace="~{fragments/navbar :: lang-button}"></div>
<div th:replace="~{fragments/navbar :: nav-menu}"></div>
<div th:replace="~{fragments/navbar :: search-bar('home')}"></div>

<div class="container">

    <div class="section-header">
        <h2 th:text="#{home.bestsellers}">Хіти продажу</h2>
        <a th:href="@{/books}" class="more-btn" th:text="#{home.more}">Більше</a>
    </div>
    <div class="book-grid">
        <div class="book-card" th:each="book : ${bestSellers}">
            <div class="book-content">
                <img th:src="${book.photoUrl}" alt="Book Cover">
                <div class="book-info">
                    <h3 th:text="${book.name}">Назва книги</h3>
                    <p th:text="${book.author}">Автор</p>
                </div>
            </div>
            <div class="book-price" th:text="${book.price} + ' грн'"></div>
        </div>
    </div>

    <div class="section-header">
        <h2 th:text="#{home.new}">Новинки</h2>
        <a th:href="@{/books}" class="more-btn" th:text="#{home.more}">Більше</a>
    </div>
    <div class="book-grid">
        <div class="book-card" th:each="book : ${newArrivals}">
            <div class="book-content">
                <img th:src="${book.photoUrl}" alt="Book Cover">
                <div class="book-info">
                    <h3 th:text="${book.name}">Назва книги</h3>
                    <p th:text="${book.author}">Автор</p>
                </div>
            </div>
            <div class="book-price" th:text="${book.price} + ' грн'"></div>
        </div>
    </div>

    <div class="section-header">
        <h2 th:text="#{home.child}">Для дітей</h2>
        <a th:href="@{/books}" class="more-btn" th:text="#{home.more}">Більше</a>
    </div>
    <div class="book-grid">
        <div class="book-card" th:each="book : ${forChild}">
            <div class="book-content">
                <img th:src="${book.photoUrl}" alt="Book Cover">
                <div class="book-info">
                    <h3 th:text="${book.name}">Назва книги</h3>
                    <p th:text="${book.author}">Автор</p>
                </div>
            </div>
            <div class="book-price" th:text="${book.price} + ' грн'"></div>
        </div>
    </div>

</div>

</body>
</html>
