<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{book.add.title}">Edit Book</title> <style>
    body { margin: 0; padding-top: 100px; background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
    .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 50px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #1a2a6c; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    .btn-save { background: #1a2a6c; color: white; border: none; padding: 12px 20px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.3s; }
    .btn-save:hover { background: #121d4b; }
    .error-msg-container { margin-bottom: 20px; padding: 15px; border: 1px solid #e74c3c; border-radius: 8px; background: #fff5f5; color: #c0392b; font-size: 14px; }
    .field-error { color: #e74c3c; font-size: 12px; margin-top: 5px; font-weight: 600; }
</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: lang-button}"></div>
<div th:replace="~{fragments/navbar :: nav-menu}"></div>

<div class="form-container">
    <h2 style="color: #1a2a6c; margin-top: 0;" th:text="#{book.add.title}">Edit Book</h2>

    <form th:action="@{/staff/books/edit/{id}(id=${bookId})}" th:object="${book}" method="POST" novalidate>

        <div th:if="${#fields.hasAnyErrors()}" class="error-msg-container">
            <strong th:text="#{book.form.error_header}">Please fix the errors:</strong>
            <ul>
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="form-group">
            <label th:text="#{book.form.name}">Book Name</label>
            <input type="text" th:field="*{name}" required>
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label th:text="#{book.form.author}">Author</label>
                <input type="text" th:field="*{author}" required>
                <div class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
            </div>
            <div class="form-group" style="flex: 1;">
                <label th:text="#{book.form.genre}">Genre</label>
                <input type="text" th:field="*{genre}" required>
                <div class="field-error" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></div>
            </div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label th:text="#{book.form.price}">Price (₴)</label>
                <input type="number" step="0.01" th:field="*{price}" required>
                <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="form-group" style="flex: 1;">
                <label th:text="#{book.form.pages}">Pages</label>
                <input type="number" th:field="*{pages}" required>
                <div class="field-error" th:if="${#fields.hasErrors('pages')}" th:errors="*{pages}"></div>
            </div>
        </div>

        <div class="form-group">
            <label th:text="#{book.form.photo}">Photo URL</label>
            <input type="text" th:field="*{photoUrl}">
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label th:text="#{book.form.age_group}">Age Group</label>
                <select th:field="*{ageGroup}">
                    <option th:each="group : ${ageGroups}"
                            th:value="${group}"
                            th:text="#{${'age.' + group.toString().toLowerCase()}}"></option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label th:text="#{book.form.language}">Language</label>
                <select th:field="*{language}">
                    <option th:each="lang : ${languages}"
                            th:value="${lang}"
                            th:text="#{${'language.' + lang.toString().toLowerCase()}}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label th:text="#{book.form.date}">Publication Date</label>
            <input type="date" th:field="*{publicationDate}" required>
            <div class="field-error" th:if="${#fields.hasErrors('publicationDate')}" th:errors="*{publicationDate}"></div>
        </div>

        <div class="form-group">
            <label th:text="#{book.form.description}">Description</label>
            <textarea th:field="*{description}" rows="4"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <button type="submit" class="btn-save" th:text="#{book.form.save}">Update Changes</button>
        <a th:href="@{/staff}"
           style="display: block; text-align: center; margin-top: 15px; color: #777; text-decoration: none; font-size: 14px;"
           th:text="#{book.form.cancel}">Cancel</a>
    </form>
</div>

</body>
</html>
