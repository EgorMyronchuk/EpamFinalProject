<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
    <h2>Login</h2>

    <form th:action="@{/auth/login}" th:object="${createUserReq}" method="post">

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Enter password" required>
        </div>

        <button type="submit">Login</button>

        <p class="switch">
            Don’t have an account?
            <a th:href="@{/auth/register}">Register</a>
        </p>
    </form>
</div>

</body>
</html>
