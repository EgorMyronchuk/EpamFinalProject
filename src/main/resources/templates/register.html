<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
    <h2>Registration</h2>

    <form th:action="@{/auth/register}" th:object="${createUserReq}" method="post">

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Enter password" required>
        </div>

        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter name" required>
        </div>

        <button type="submit">Register</button>

        <p class="switch">
            Already have an account?
            <a th:href="@{/auth/login}">Login</a>
        </p>
    </form>
</div>

</body>
</html>
